name: test

on:
  push:
  pull_request:

permissions: {}

jobs:
  sourcemod-plugin:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup SourcePawn Compiler
        uses: rumblefrog/setup-sp@master
        with:
          version: "1.12.x"

      - name: Ensure plugin builds
        working-directory: ./sourcemod/scripting
        run: spcomp -i"./include/" gbans.sp -o ../plugins/gbans.smx

  lint-ts:
    runs-on: ubuntu-26.04
    env:
      GBANS_GENERAL_STEAM_KEY: ${{ secrets.GBANS_GENERAL_STEAM_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 12
          install: true
          runtime: node
          working-directory: frontend
          require-lockfile: true

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome
        working-directory: ./frontend
        run: biome ci .

      - name: TypeScript
        run: just typecheck-frontend

  lint-golangci:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: "latest"
          args: --timeout=10m

  backend-test:
    needs: [lint-golangci]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build test database image
        run: just build-test-db

      - name: Backend tests
        run: just test-backend

  frontend-test:
    needs: [lint-ts]
    runs-on: ubuntu-26.04
    env:
      GBANS_GENERAL_STEAM_KEY: ${{ secrets.GBANS_GENERAL_STEAM_KEY }}
    steps:
      - uses: actions/checkout@v7
      
      - uses: pnpm/setup@v3
        with:
          version: 12
          install: true
          runtime: node
          working-directory: frontend
          require-lockfile: true

      - name: Frontend tests
        run: just test-frontend

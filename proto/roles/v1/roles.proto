edition = "2023";

package roles.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service RolesService {
  rpc RoleList(google.protobuf.Empty) returns (RoleListResponse) {}
  rpc RoleCreate(RoleCreateRequest) returns (RoleCreateResponse) {}
  rpc RoleEdit(RoleEditRequest) returns (RoleEditResponse) {}
  rpc RoleDelete(RoleDeleteRequest) returns (google.protobuf.Empty) {}
  rpc RoleAssign(RoleAssignRequest) returns (google.protobuf.Empty) {}
  rpc RoleUnassign(RoleUnassignRequest) returns (google.protobuf.Empty) {}
  rpc RoleBySteamID(RoleBySteamIDRequest) returns (RoleBySteamIDResponse) {}
  rpc RoleUsers(google.protobuf.Empty) returns (RoleUsersResponse) {}
  rpc SetUserRoles(SetUserRolesRequest) returns (google.protobuf.Empty) {}
}

message RoleBySteamIDRequest {
  uint64 steam_id = 1 [(buf.validate.field).uint64 = {gte: 76561197960265729}];
}

message RoleBySteamIDResponse {
  repeated Role roles = 1;
}

message RoleUser {
  uint64 steam_id = 1;
  string persona_name = 2;
  repeated Role roles = 3;
}

message RoleUsersResponse {
  repeated RoleUser users = 1;
}

message RoleAssignRequest {
  uint64 steam_id = 1 [(buf.validate.field).uint64 = {gte: 76561197960265729}];
  int32 role_id = 2 [(buf.validate.field).int32 = {gt: 0}];
}

message RoleUnassignRequest {
  uint64 steam_id = 1 [(buf.validate.field).uint64 = {gte: 76561197960265729}];
  int32 role_id = 2 [(buf.validate.field).int32 = {gt: 0}];
}

message SetUserRolesRequest {
  uint64 steam_id = 1 [(buf.validate.field).uint64 = {gte: 76561197960265729}];
  repeated int32 role_id = 2 [(buf.validate.field).repeated = {
    unique: true
    items: {
      int32: {gt: 0}
    }
  }];
}

message RoleDeleteRequest {
  uint32 role_id = 1 [(buf.validate.field).uint32 = {gt: 0}];
}

message RoleEditRequest {
  int32 role_id = 1 [(buf.validate.field).int32 = {gt: 0}];
  string role_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  repeated Permission permissions = 3 [(buf.validate.field).repeated = {
    unique: true
    items: {
      enum: {defined_only: true}
    }
  }];
}

message RoleEditResponse {}

message RoleListResponse {
  repeated Role roles = 1;
}

message RoleCreateResponse {
  Role role = 1;
}

message RoleCreateRequest {
  string role_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  repeated Permission permissions = 2 [(buf.validate.field).repeated = {
    unique: true
    items: {
      enum: {defined_only: true}
    }
  }];
}

message Role {
  int32 role_id = 1;
  string role_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  repeated Permission permissions = 3 [(buf.validate.field).repeated = {
    unique: true
    items: {
      enum: {defined_only: true}
    }
  }];
  google.protobuf.Timestamp created_on = 4;
  google.protobuf.Timestamp updated_on = 5;
  uint64 user_count = 6;
}

enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_ANTICHEAT_READ = 10;
  PERMISSION_APPEAL_READ = 20;
  PERMISSION_APPEAL_WRITE = 21;
  PERMISSION_APPEAL_ADMIN = 22;
  PERMISSION_ASSET_CREATE = 30;
  PERMISSION_ASSET_DELETE = 31;
  PERMISSION_BAN_READ = 40;
  PERMISSION_BAN_WRITE = 41;
  PERMISSION_BAN_CREATE = 42;
  PERMISSION_BLOCKLIST_READ = 50;
  PERMISSION_BLOCKLIST_WRITE = 51;
  PERMISSION_BLOCKLIST_DELETE = 52;
  PERMISSION_CHATLOG_READ = 60;
  PERMISSION_CONFIG_READ = 70;
  PERMISSION_CONFIG_WRITE = 71;
  PERMISSION_CONTEST_READ = 80;
  PERMISSION_CONTEST_WRITE = 81;
  PERMISSION_CONTEST_DELETE = 82;
  PERMISSION_CONTEST_ADMIN = 83;
  PERMISSION_CURRENT_PROFILE = 90;
  PERMISSION_CURRENT_SETTINGS = 91;

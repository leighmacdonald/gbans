  PERMISSION_NEWS_DELETE = 162;
  PERMISSION_NOTIFICATIONS = 170;
  PERMISSION_PERSON_READ = 180;
  PERMISSION_PERSON_WRITE = 181;
  PERMISSION_PLAYER_PROFILE = 190;
  PERMISSION_REPORT_READ = 200;
  PERMISSION_REPORT_WRITE = 201;
  PERMISSION_REPORT_CREATE = 202;
  PERMISSION_REPORT_ADMIN = 203;
  PERMISSION_ROLE_READ = 210;
  PERMISSION_ROLE_WRITE = 211;
  PERMISSION_SERVER_READ = 220;
  PERMISSION_SERVER_WRITE = 221;
  PERMISSION_SPEEDRUN_READ = 230;
  PERMISSION_SPEEDRUN_WRITE = 231;
  PERMISSION_STATS_READ = 240;
  PERMISSION_STEAMID_RESOLVE = 250;
  PERMISSION_WIKI_READ = 260;

  PERMISSION_GAMEADMIN_READ = 130;
  PERMISSION_GAMEADMIN_WRITE = 131;
  PERMISSION_NETWORK_READ = 150;
  PERMISSION_NETWORK_ADMIN = 151;
  PERMISSION_NEWS_READ = 160;

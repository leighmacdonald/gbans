edition = "2023";

package stats.v1;

import "buf/validate/validate.proto";
import "database/query/v1/filter.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "maps/v1/maps.proto";
import "person/v1/person_core.proto";

enum Team {
  TEAM_UNASSIGNED_UNSPECIFIED = 0;
  TEAM_SPEC = 1;
  TEAM_RED = 2;
  TEAM_BLU = 3;
}

service StatsService {
  // Query a single match
  rpc Match(MatchRequest) returns (MatchResponse) {
    // option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Query all matches
  rpc QueryMatches(QueryMatchesRequest) returns (QueryMatchesResponse) {}
  // Query all matches belonging to a player
  rpc MatchesWithPlayer(MatchesWithPlayerRequest) returns (MatchesWithPlayerResponse) {}
  // Query
  // - Known buckets. Each leaf defines how the stats are grouped and queried.
  //   (Bukets)
  //   - Bucket (mvm)
  //     - ...
  //   - Bucket (casual)
  //     (TimeBuckets)
  //     - Yearly
  //     - Monthly
  //     - Alltime
  //       (Overall buckets)
  //       - Kills
  //       - Healing
  //       - Weapons
  //         (Variant Buckets)
  //         - Variant: scattergun
  //       - Classes
  //         (Variant Buckets)
  //         - Variant: soldier
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse) {}
  rpc WeaponList(google.protobuf.Empty) returns (WeaponListResponse) {}
  rpc MapList(google.protobuf.Empty) returns (MapListResponse) {}
  rpc Buckets(google.protobuf.Empty) returns (BucketsResponse) {}
  // QueryMapStats returns per-map aggregate statistics, summary totals and the
  // top maps for a stats bucket over a time range.
  rpc QueryMapStats(QueryMapStatsRequest) returns (QueryMapStatsResponse) {}
  // QueryMapStatsHistory returns bucketed per-map series for charting playtime
  // or match activity over a time range.
  rpc QueryMapStatsHistory(QueryMapStatsHistoryRequest) returns (QueryMapStatsHistoryResponse) {}
  // RefreshStats recomputes all stats summary views on demand. Admin only.
  rpc RefreshStats(google.protobuf.Empty) returns (RefreshStatsResponse) {}
}

message MatchesWithPlayerRequest {
  int64 steam_id = 1 [(buf.validate.field).int64 = {gte: 76561197960265729}];
}

message MapListResponse {
  repeated maps.v1.Map maps = 1;
}

message PlayerMatchHistory {
  string match_id = 1;
  int32 server_id = 2;
  string server_name = 3;
  string server_name_short = 4;
  int32 map_id = 5;
  string map_name = 6;
  int32 demo_id = 7;
  string bucket_name = 8;
  int32 bucket_id = 9;
  string hostname = 10;
  uint32 score_red = 11;
  uint32 score_blu = 12;
  uint64 duration = 13;
  bool is_winner = 14;
  google.protobuf.Timestamp created_on = 15;
  google.protobuf.Timestamp start_time = 16;
}

message MatchesWithPlayerResponse {
  repeated PlayerMatchHistory matches = 1;
}

message WeaponListResponse {
  repeated string weapons = 1;
}

// Bucket is the highest level grouping of stats. Non standard game modes should generally
// want to have a bucket per game mode so that stat sums can be broken down into numbers
// that are not skewed.
message Bucket {
  int32 stats_bucket_id = 1;
  string bucket_name = 2;
  bool is_enabled = 3;
  // is_default marks the bucket used for servers and matches without an
  // explicit bucket. At most one bucket is the default.
  bool is_default = 4;
}

message BucketsResponse {
  repeated Bucket buckets = 1;
}

message MapStat {
  int32 map_id = 1;
  string map_name = 2;
  uint64 matches_played = 3;
  uint64 matches_decided = 4;
  uint64 matches_drawn = 5;
  uint64 red_wins = 6;
  uint64 blu_wins = 7;
  uint64 total_duration_ms = 8;
  uint64 rounds_played = 9;
  uint64 stalemate_rounds = 10;
  uint64 unique_players = 11;
  uint64 player_appearances = 12;
  uint64 kills = 13;
  uint64 assists = 14;
  uint64 deaths = 15;
  uint64 damage = 16;
  uint64 healing = 17;
  uint64 captures = 18;
  uint64 captures_blocked = 19;
  google.protobuf.Timestamp first_played_at = 20;
  google.protobuf.Timestamp last_played_at = 21;
}

message MapStatsSummary {
  uint64 maps_played = 1;
  uint64 matches_played = 2;
  uint64 matches_decided = 3;
  uint64 matches_drawn = 4;
  uint64 total_duration_ms = 5;
  uint64 rounds_played = 6;
}

message QueryMapStatsRequest {
  uint32 stats_bucket_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gt = 0
  ];
  // start and end bound the inclusive [start, end] date range. When start is
  // unset the query covers all time and uses the all-time view.
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
  database.query.v1.Filter filter = 4;
  string search = 5 [(buf.validate.field).string.max_len = 256];
}

message MapPrefixStat {
  // prefix is the map type prefix of the normalized map name, e.g. "cp_",
  // "pl_", "koth_". Workshop maps are normalized to the underlying map name
  // first (workshop/pl_foo.ugc123 becomes pl_foo). Maps without a prefix are
  // grouped under "other".
  string prefix = 1;
  uint64 maps_played = 2;
  uint64 matches_played = 3;
  uint64 matches_decided = 4;
  uint64 total_duration_ms = 5;
}

message QueryMapStatsResponse {
  uint64 count = 1;
  repeated MapStat maps = 2;
  MapStatsSummary summary = 3;
  repeated MapStat top_maps = 4;
  // prefixes groups the maps of the same range, bucket and search scope by
  // map type prefix, ordered by total duration descending.
  repeated MapPrefixStat prefixes = 5;
}

message MapStatsPoint {
  google.protobuf.Timestamp date_bucket = 1;
  uint64 matches_played = 2;
  uint64 matches_decided = 3;
  uint64 duration_ms = 4;
}

message MapStatsSeries {
  int32 map_id = 1;
  string map_name = 2;
  repeated MapStatsPoint points = 3;
}

message QueryMapStatsHistoryRequest {
  uint32 stats_bucket_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gt = 0
  ];
  // start and end bound the time series. When start is unset the series covers
  // all time.
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
  // time_bucket selects the grouping granularity. Only DAILY, WEEKLY and
  // MONTHLY are valid here.
  TimeBucket time_bucket = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // top_n limits the number of named map series; remaining maps are combined
  // into a single "Other" series. 0 defaults to 6.
  uint32 top_n = 5 [(buf.validate.field).uint32.lte = 20];
  // map_ids restricts the series to the given maps. When set, no "Other"
  // series is produced.
  repeated int32 map_ids = 6;
}

message QueryMapStatsHistoryResponse {
  repeated MapStatsSeries series = 1;
}

message RefreshStatsResponse {
  repeated string refreshed_views = 1;
}

// The Variant picked specifies which set of stats structs are being shown.
enum Variant {
  VARIANT_OVERALL_UNSPECIFIED = 0;
  VARIANT_KILLS = 1;
  VARIANT_HEALING = 2;
  VARIANT_WEAPONS = 3;
  VARIANT_CLASSES = 4;
}

// The TimeBucket enum corresponds to the truncated date uses for grouping and indexing.
enum TimeBucket {
  TIME_BUCKET_UNSPECIFIED = 0;
  TIME_BUCKET_DAILY = 1;
  TIME_BUCKET_WEEKLY = 7;
  TIME_BUCKET_MONTHLY = 31;
  TIME_BUCKET_YEARLY = 365;
  TIME_BUCKET_ALLTIME = 99999;
}

message QueryMatchesRequest {
  database.query.v1.Filter filter = 1;
  uint32 stats_bucket_id = 2 [(buf.validate.field).uint32.gt = 0];
  repeated int32 server_id = 3;
  int32 map_id = 4;
  google.protobuf.Timestamp start_time_start = 5;
  google.protobuf.Timestamp start_time_end = 6;
}

message QueryMatchesResponse {
  uint64 count = 1;
  repeated MatchOverview matches = 2;
}

message QueryStatsRequest {
  database.query.v1.Filter filter = 1;
  uint32 stats_bucket_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gt = 0
  ];
  TimeBucket time_bucket = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  Variant variant = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  string variant_key = 5;
  google.protobuf.Timestamp time = 6 [(buf.validate.field).required = true /* (buf.validate.field).timestamp.lt_now = true */];
  // steam_id optionally requests the rank and row index of the given player
  // in the same bucket, variant and time window, reported via player_rank
  // and player_index. Unset/zero performs no lookup.
  int64 steam_id = 7 [(buf.validate.field).int64 = {gte: 76561197960265729}];
}

message QueryStatsResponse {
  Variant variant = 1;
  uint64 count = 2;
  oneof stat_container {
    VariantStatsContainer stats_variant = 3;
    OverallStatsContainer stats_overall = 4;
  }
  // my_rank is the rank of the requesting user in the queried bucket,
  // variant and time window. 0 when the user has no stats in the window.
  uint64 my_rank = 5;
  // my_index is the 0-based position of the requesting user's row in the
  // full result set, ordered by (rank, steam_id) the same way QueryStats
  // returns rows. Clients can use it to jump directly to the table page
  // containing the user's row. 0 when the user has no stats in the window.
  uint64 my_index = 6;
  // player_rank is the rank of QueryStatsRequest.steam_id in the queried
  // bucket, variant and time window, resolved independently of the page of
  // rows returned. 0 when the player has no stats in the window, or when no
  // steam_id was requested.
  uint64 player_rank = 7;
  // player_index is the 0-based position of QueryStatsRequest.steam_id's row
  // in the full result set, ordered by (rank, steam_id) the same way
  // QueryStats returns rows. Clients can use it to jump directly to the
  // table page containing the player's row. 0 when the player has no stats
  // in the window, or when no steam_id was requested.
  uint64 player_index = 8;
}


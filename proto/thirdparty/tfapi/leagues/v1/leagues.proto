syntax = "proto3";

package tfapi.leagues.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/leighmacdonald/tf-api/internal/gen/tfapi/leagues/v1;tfapileaguesv1";

// LeaguesService exposes competitive league information.
service LeaguesService {
  // History returns a player's competitive team history.
  rpc History(HistoryRequest) returns (HistoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Competitions searches through the competition history.
  rpc Competitions(CompetitionsRequest) returns (CompetitionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Teams searches through the teams.
  rpc Teams(TeamsRequest) returns (TeamsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // TeamMembers returns a team's members.
  rpc TeamMembers(TeamMembersRequest) returns (TeamMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message HistoryRequest {
  // Steam IDs in any standard format.
  repeated string steam_ids = 1;
  string league = 2;
  string type = 3;
  string format = 4;
}

message PlayerTeamHistory {
  string league = 1;
  string type = 2;
  string season_name = 3;
  string format = 4;
  string region = 5;
  string steam_id = 6;
  string team_name = 7;
  string division_name = 8;
  int32 rank = 9;
  string tag = 10;
  string alias = 11;
  bool leader = 12;
  google.protobuf.Timestamp joined_team = 13;
  google.protobuf.Timestamp left_team = 14;
}

message HistoryResponse {
  repeated PlayerTeamHistory history = 1;
}

message CompetitionsRequest {
  string league = 1;
  string format = 2;
  string type = 3;
}

message League {
  string league = 1;
  string type = 2;
  string name = 3;
  string format = 4;
  string region = 5;
  int64 league_id = 6;
}

message CompetitionsResponse {
  repeated League competitions = 1;
}

message TeamsRequest {
  string league = 1;
  int64 league_id = 2;
  string name = 3;
}

message Team {
  string team_id = 1;
  string league = 2;
  string name = 3;
  string division_name = 4;
  int32 rank = 5;
  string tag = 6;
  int64 league_id = 7;
}

message TeamsResponse {
  repeated Team teams = 1;
}

message TeamMembersRequest {
  string league = 1;
  int64 league_id = 2;
}

message TeamMember {
  string steam_id = 1;
  string name = 2;
  bool leader = 3;
  google.protobuf.Timestamp joined = 4;
  google.protobuf.Timestamp left = 5;
  int64 league_id = 6;
}

message TeamMembersResponse {
  repeated TeamMember members = 1;
}

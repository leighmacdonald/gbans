edition = "2023";

package chat.v1;

import "buf/validate/validate.proto";
import "database/query/v1/filter.proto";
import "google/protobuf/timestamp.proto";

service ChatService {
  rpc Query(QueryRequest) returns (QueryResponse) {}
  rpc QueryContext(QueryContextRequest) returns (QueryContextResponse) {}
  rpc StreamChat(StreamChatRequest) returns (stream StreamChatResponse) {}
}

message StreamChatRequest {
  // Empty means chat from all servers.
  repeated int32 server_ids = 1 [(buf.validate.field).repeated.unique = true];
  // Maximum number of buffered messages replayed before the live stream starts. 0 uses the default.
  int32 history_limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
}

message StreamChatResponse {
  uint64 seq = 1;
  int64 steam_id = 2 [(buf.validate.field).int64 = {gte: 76561197960265729}];
  string avatar_hash = 3;
  string persona_name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  int32 server_id = 5 [(buf.validate.field).int32.gt = 0];
  string server_name = 6;
  string body = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  bool is_team = 8;
  google.protobuf.Timestamp created_on = 9;
  // Keepalive pings are emitted periodically so intermediaries (reverse proxies,
  // Cloudflare) do not drop the stream while no chat is being sent. Clients must
  // ignore any message where this is true.
  bool keepalive = 10;
}

message QueryContextRequest {
  int64 person_message_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64 = {gt: 0}
  ];
  int32 padding = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gt: 0
      lt: 250
    }
  ];
}

message QueryContextResponse {
  repeated Message messages = 1 [(buf.validate.field).required = true];
}

message QueryRequest {
  database.query.v1.Filter filter = 1;
  string query = 2;
  repeated int32 server_ids = 3 [(buf.validate.field).repeated.unique = true];
  google.protobuf.Timestamp date_start = 4;
  google.protobuf.Timestamp date_end = 5;
  bool flagged_only = 6;
  int64 steam_id = 7 [(buf.validate.field).int64 = {gte: 76561197960265729}];
}

message QueryResponse {
  repeated Message messages = 1 [(buf.validate.field).required = true];
}

message Message {
  int64 person_message_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64 = {gt: 0}
  ];
  string match_id = 2 [(buf.validate.field).string.uuid = true];
  int64 steam_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64 = {gte: 76561197960265729}
  ];
  string avatar_hash = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 40
  ];
  string persona_name = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 2
      max_len: 32
    }
  ];
  string server_name = 6 [(buf.validate.field).required = true];
  int32 server_id = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {gt: 0}
  ];
  string body = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
    }
  ];
  google.protobuf.Timestamp created_on = 9 [(buf.validate.field).required = true];
  int32 auto_filter_flagged = 10 [(buf.validate.field).required = true];
  int32 demo_id = 11 [(buf.validate.field).int32.gt = 0];
  int32 demo_tick = 12;
  string asset_id = 13 [(buf.validate.field).string.uuid = true];
}
